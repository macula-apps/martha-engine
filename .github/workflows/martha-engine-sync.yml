# Keeps the fork on Goose's main (macula-io/martha#547 S2). Daily it merges upstream's main into a branch sync/<sha>
# made from the fork's main (a merge, never a rebase or a force-push), runs upstream's own CI and the fork's checks on
# that branch, and only when both pass opens a pull request into main. Main moves only when that pull request lands.
# A day is skipped when upstream has not moved or an earlier sync is unfinished. A conflict, a refused push or a red
# check stops here, on the branch, naming the patch; a person finishes it and dispatches the job with `resume`.
name: martha-engine sync

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      resume:
        description: A sync branch a person has finished merging, like sync/0123456789ab; empty syncs upstream's main
        required: false
        type: string

permissions: {}

concurrency:
  group: martha-engine-sync

# bash with pipefail: a script piped into tee fails the step when the script fails.
defaults:
  run:
    shell: bash

jobs:
  merge:
    name: Merge upstream's main into its sync branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sync: ${{ steps.pick.outputs.sync }}
      upstream: ${{ steps.pick.outputs.upstream }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none

      - id: pick
        env:
          RESUME: ${{ inputs.resume }}
        run: martha/sync/pick_the_upstream_change.sh "$RESUME" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.pick.outputs.sync != '' && steps.pick.outputs.merged != '1'
        env:
          SYNC: ${{ steps.pick.outputs.sync }}
          UPSTREAM: ${{ steps.pick.outputs.upstream }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          martha/sync/merge_the_upstream_change.sh "$SYNC" "$UPSTREAM" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push the sync branch, merged or left at main for a person
        if: ${{ !cancelled() && steps.pick.outputs.sync != '' && steps.pick.outputs.merged != '1' }}
        env:
          SYNC: ${{ steps.pick.outputs.sync }}
          UPSTREAM: ${{ steps.pick.outputs.upstream }}
        run: martha/sync/push_the_sync_branch.sh "$SYNC" "$UPSTREAM" | tee -a "$GITHUB_STEP_SUMMARY"

  checks:
    needs: merge
    if: needs.merge.outputs.sync != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/martha-engine-checks.yml
    with:
      ref: ${{ needs.merge.outputs.sync }}

  upstream-ci:
    name: Run upstream's CI on the sync branch
    needs: merge
    if: needs.merge.outputs.sync != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ needs.merge.outputs.sync }}
    steps:
      - run: |
          gh workflow run ci.yml --ref "$BRANCH"
          for _ in $(seq 30); do
            run="$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run" ] && break
            sleep 10
          done
          [ -n "$run" ] || { echo "::error::upstream's CI did not start on $BRANCH"; exit 1; }
          echo "upstream CI on $BRANCH: run $run" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run" --exit-status --interval 60 > /dev/null

  name-the-patch:
    name: Name the patch behind a red check
    needs: [merge, checks, upstream-ci]
    if: failure() && needs.merge.result == 'success' && needs.merge.outputs.sync != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SYNC: ${{ needs.merge.outputs.sync }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.merge.outputs.sync }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - run: |
          echo "A check is red on $SYNC. Among the files its merge changed:" >> "$GITHUB_STEP_SUMMARY"
          mapfile -t changed < <(git diff --name-only HEAD^1 HEAD)
          martha/sync/name_the_patch.sh "${changed[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  pull-request:
    name: Open the pull request into main
    needs: [merge, checks, upstream-ci]
    if: needs.merge.outputs.sync != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SYNC: ${{ needs.merge.outputs.sync }}
      UPSTREAM: ${{ needs.merge.outputs.upstream }}
    steps:
      - run: |
          gh pr create --base main --head "$SYNC" --title "Sync upstream main at ${UPSTREAM:0:12}" \
            --body "Merges Goose's main at $UPSTREAM into the fork. Upstream's CI and the fork's checks passed on this branch (run $GITHUB_RUN_ID); its summary names any workflow this merge adds, to turn off before this lands. Main moves only when this lands."
