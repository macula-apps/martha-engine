# This workflow builds release artifacts for release branches and publishes tagged releases.
on:
  push:
    paths-ignore:
      - "documentation/**"
    branches:
      - "release/*"
    tags:
      - "v1.*"

name: Release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-acp:
    uses: ./.github/workflows/build-acp.yml

  release-acp:
    name: Release lean goose-acp
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build-acp
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download goose-acp artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: goose-acp-*
          merge-multiple: true

      - name: Attest goose-acp
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: goose-acp-*

      - name: Publish goose-acp without marking the release latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "$GITHUB_REF_NAME" --notes ""
          published=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for file in goose-acp-*; do
            if grep -qxF "$file" <<< "$published"; then
              echo "$file is already published; keeping the existing file"
            else
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done

  # ------------------------------------
  # 1) Bundle CLI and Desktop (Linux)
  # ------------------------------------
  build-cli-linux:
    uses: ./.github/workflows/build-cli-linux.yml
    with:
      package_desktop: true

  # ------------------------------------
  # 2) Upload Install CLI Script
  # ------------------------------------
  install-script:
    name: Upload Install Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: download_cli.sh
          path: download_cli.sh

  # ------------------------------------
  # 3) Create/Update GitHub Release
  # ------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-acp, release-acp, build-cli-linux, install-script]
    permissions:
      contents: write
      id-token: write      # Required for Sigstore OIDC signing
      attestations: write  # Required for SLSA build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create source code bundles
        run: |
          git archive --format=tar.gz --prefix="goose-${GITHUB_REF_NAME}/" --output="goose-source-${GITHUB_REF_NAME}.tar.gz" HEAD
          git archive --format=zip --prefix="goose-${GITHUB_REF_NAME}/" --output="goose-source-${GITHUB_REF_NAME}.zip" HEAD

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: '!internal-*'
          merge-multiple: true

      # Release lean goose-acp already published these; re-uploading could change pinned hashes.
      - name: Keep lean goose-acp off the versioned release
        run: mkdir lean-goose-acp && mv goose-acp-* lean-goose-acp/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            download_cli.sh
            lean-goose-acp/goose-acp-*

      # Create/update the versioned release
      - name: Release versioned
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            download_cli.sh
          allowUpdates: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
          makeLatest: true

      # Create/update the stable release
      - name: Release stable
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: stable
          name: Stable
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            download_cli.sh
            lean-goose-acp/goose-acp-*
          allowUpdates: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
